# Publishes @synthesia-ai/sdk to npm when a v* tag is pushed, with trusted publishing and provenance.
# Ours, not Fern's: kept through .fernignore. Nothing else in this repo publishes, and no npm token exists.
# - Runs only in the synthesia-ai repo; in a fork or any other copy, every job is skipped.
# - `build` has no id-token. It checks the tagged commit is on main and matches package.json's version, builds from
#   the lockfile and uploads the package. `publish` runs in the `release` environment (reviewers, prevent
#   self-review, v* tags only), checks the commit is on main again, and publishes only that package. It's the only job
#   that can get an npm token, through the trusted publisher pinned to this repo, release.yml and `release`.
# - GitHub-hosted runners only, Harden-Runner blocking all other egress, actions pinned by SHA, no caches, and no
#   ${{ }} expression inside a run: script.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  build:
    if: github.repository_owner == 'synthesia-ai'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false

      - name: Require the tagged commit to be on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; refusing to release an unmerged commit"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.0

      - name: Require the tag to match package.json's version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json's version $version"
            exit 1
          fi

      - name: Build
        run: |
          corepack enable  # The pnpm in package.json's packageManager
          pnpm install --frozen-lockfile --ignore-scripts  # The build needs no install scripts
          pnpm build
          pnpm pack --pack-destination package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package/*.tgz
          if-no-files-found: error

  publish:
    needs: build
    if: github.repository_owner == 'synthesia-ai'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # npm trusted publishing and provenance
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443

      - name: Require the tagged commit to be on main
        # Again here, as this job holds id-token. "identical" or "behind" means the commit is in main's history.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; refusing to publish"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      # Node 24.22.0 ships npm 11.19.1; trusted publishing needs 11.5.1 or later, so nothing is installed here. No
      # registry-url: npm's default registry is npmjs.org, and it gets its token through OIDC, not an .npmrc.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.0

      - name: Publish
        # ./ matters: without it, npm reads package/<name>.tgz as a GitHub repo shorthand and tries to clone it.
        run: npm publish ./package/*.tgz --provenance --access public
