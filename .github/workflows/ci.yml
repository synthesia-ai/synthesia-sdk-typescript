# Ours, not Fern's: kept through .fernignore. Fern's template uses unpinned third-party actions
# and a publish job that publishes publicly on any tag.
# Publishing has its own trusted-publishing workflow (release.yml); this one only builds and tests.
# - GitHub-hosted runners with Harden-Runner, like release.yml.
# - Harden-Runner blocks all egress not in each job's allowed-endpoints.
# - The secrets job fails on a secret or an internal reference; .pre-commit-config.yaml has the same checks as
#   optional local hooks.
# - Same Node as release.yml.
name: ci
on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.0
      - name: Install pnpm
        run: corepack enable  # The version in package.json's packageManager
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile
        run: pnpm build

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            raw.githubusercontent.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.0
      - name: Install pnpm
        run: corepack enable  # The version in package.json's packageManager
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Unit and wire tests; the wire tests' mock server runs in-process, so no Docker is needed.
      - name: Test
        run: pnpm test

  # Secrets (gitleaks, on the tree and every commit) and internal references (.github/check_internal_refs.py).
  # Both print where a match is, never what it is: these logs are public once the repository is.
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0  # gitleaks git scans every commit in HEAD's history
          persist-credentials: false
      # The release binary, checked against its sha256 (the same value as the release's checksums.txt and GitHub's
      # asset digest). Not gitleaks-action: it needs a paid licence for organisations.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      # Both read .gitleaks.toml. --redact keeps matched values out of the log. Each check runs even if an earlier
      # one failed, so one run reports everything.
      - name: Scan the tree for secrets
        run: $RUNNER_TEMP/gitleaks dir . --redact --no-banner --verbose
      - name: Scan the history for secrets
        if: '!cancelled()'
        # HEAD's history only; by default gitleaks scans every fetched branch, not just the one being checked.
        run: $RUNNER_TEMP/gitleaks git . --log-opts=HEAD --redact --no-banner --verbose
      - name: Check for internal references
        if: '!cancelled()'
        run: python3 .github/check_internal_refs.py
